<title>صانع الفواتير</title>
<style>
  :root {
    --ink: #1d2433;
    --muted: #5d6676;
    --rule: #c5cad4;
    --paper: #ffffff;
    --desk: #e9ecf1;
    --accent: #1f5f5b;
    --accent-dark: #174a47;
    --focus: #e2a43b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--desk);
    color: var(--ink);
    font-family: "Noto Naskh Arabic", "Segoe UI", Tahoma, "Geeza Pro", "Arial", sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }

  /* شريط الأدوات */
  .toolbar {
    max-width: 210mm;
    margin: 0 auto;
    padding: 14px 12px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .toolbar .spacer { flex: 1; }
  button, .toggle {
    font: inherit;
    font-size: 15px;
    border-radius: 6px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink);
    padding: 7px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-dark); }
  button.confirming { background: #fff3e0; border-color: #c77a00; color: #7a4a00; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; user-select: none; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--accent); }

  /* ورقة الفاتورة */
  .sheet {
    width: 210mm;
    max-width: 100%;
    min-height: 270mm;
    margin: 12px auto 40px;
    background: var(--paper);
    padding: 16mm 14mm;
    box-shadow: 0 1px 2px rgba(20, 30, 50, .12), 0 8px 28px rgba(20, 30, 50, .08);
  }

  input, textarea {
    font: inherit;
    color: inherit;
    border: 0;
    background: transparent;
    width: 100%;
    padding: 6px 8px;
    border-radius: 4px;
  }
  input::placeholder, textarea::placeholder { color: #aab0bc; }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }

  .shop {
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    padding-bottom: 4px;
  }
  .doc-title {
    text-align: center;
    font-size: 20px;
    letter-spacing: .02em;
    color: var(--muted);
    margin: 0 0 18px;
    padding-bottom: 12px;
    border-bottom: 3px double var(--ink);
  }

  .meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 22px;
    margin-bottom: 18px;
  }
  .field {
    display: flex;
    align-items: baseline;
    gap: 8px;
    border-bottom: 1px solid var(--ink);
    padding: 4px 0;
  }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-weight: 700; white-space: nowrap; }
  .field input { flex: 1; min-width: 0; }
  .field.client input { font-size: 19px; }

  /* الجدول */
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    border: 1px solid var(--ink);
    padding: 0;
  }
  th {
    background: #eef0f4;
    font-weight: 700;
    padding: 8px;
    text-align: center;
  }
  td input { text-align: right; padding: 9px 8px; }
  td.qty input { text-align: center; }
  td.price input { text-align: center; }
  col.c-qty { width: 16%; }
  col.c-price { width: 18%; }
  col.c-act { width: 34px; }

  .price-col { display: none; }
  table.with-price .price-col { display: table-cell; }

  th.act, td.act { border: 0; background: transparent; }
  td.act { text-align: center; }
  .del {
    border: 0;
    background: transparent;
    color: #a3a9b5;
    padding: 4px 6px;
    font-size: 18px;
    line-height: 1;
  }
  .del:hover { color: #b3261e; border: 0; }

  tfoot td {
    background: #f6f7f9;
    font-weight: 700;
    padding: 9px 8px;
    text-align: center;
  }
  tfoot td.label { text-align: left; }
  tfoot td.blank { border: 0; background: transparent; }

  .add-row { margin-top: 10px; }

  .notes { margin-top: 20px; }
  .notes label { font-weight: 700; display: block; margin-bottom: 2px; }
  .notes textarea {
    border: 1px solid var(--rule);
    min-height: 70px;
    resize: vertical;
  }

  [hidden] { display: none !important; }

  .tabs {
    display: flex;
    border: 1px solid var(--rule);
    border-radius: 6px;
    overflow: hidden;
    background: var(--paper);
  }
  .tabs button { border: 0; border-radius: 0; }
  .tabs button.on { background: var(--ink); color: #fff; }
  .status { font-size: 14px; color: var(--accent); }
  .status.warn { color: #9a5b00; }

  .hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .filter { margin-bottom: 10px; }
  .filter input {
    border: 1px solid var(--rule);
    background: #fff;
    max-width: 320px;
  }
  table.sum-table { table-layout: auto; }
  .sum-table td { padding: 8px; text-align: right; }
  .sum-table td.num { text-align: center; }
  .sum-table th.w-num, .sum-table td.num { width: 18%; }
  .sum-table td.empty { text-align: center; color: var(--muted); padding: 18px 8px; }
  .section-title { font-size: 18px; font-weight: 700; margin: 28px 0 8px; }
  .small-btn { padding: 3px 10px; font-size: 14px; margin-inline-start: 4px; }
  .actions-cell { white-space: nowrap; text-align: center !important; width: 1%; }
  .backup { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .backup input[type=file] { display: none; }

  @media print {
    .no-print { display: none !important; }
  }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    .sheet { padding: 12px 8px; min-height: 0; }
    .meta { grid-template-columns: 1fr; }
    col.c-qty { width: 22%; }
    col.c-price { width: 24%; }
  }

  /* الطباعة */
  @page { size: A4; margin: 10mm; }
  @media print {
    body { background: #fff; font-size: 16px; }
    .toolbar, .add-row, .act, .notes.empty { display: none !important; }
    .sheet { box-shadow: none; margin: 0; padding: 0; width: auto; min-height: 0; }
    input::placeholder, textarea::placeholder { color: transparent; }
    .notes textarea { border: 0; padding: 0; }
    th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tr { break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="tabs" role="group" aria-label="العرض">
    <button type="button" id="tabInvoice" class="on">الفاتورة</button>
    <button type="button" id="tabSummary">ملخص النقشات</button>
  </div>
  <button type="button" class="primary inv-only" id="saveBtn">حفظ الفاتورة</button>
  <button type="button" class="inv-only" id="newBtn">فاتورة جديدة</button>
  <button type="button" id="printBtn">طباعة / حفظ PDF</button>
  <button type="button" id="installBtn" hidden>تثبيت التطبيق</button>
  <span class="status" id="status" role="status"></span>
  <span class="spacer"></span>
  <label class="toggle inv-only"><input type="checkbox" id="priceToggle"> إضافة عمود السعر (اختياري)</label>
</div>

<main class="sheet" id="sheet">
  <input class="shop" id="shop" type="text" placeholder="اسم المنشأة (اختياري)" aria-label="اسم المنشأة">
  <p class="doc-title">فاتورة</p>

  <section class="meta">
    <div class="field client wide">
      <label for="client">اسم العميل:</label>
      <input id="client" type="text" autocomplete="off">
    </div>
    <div class="field">
      <label for="invNo">رقم الفاتورة:</label>
      <input id="invNo" type="text" inputmode="numeric" value="1" autocomplete="off">
    </div>
    <div class="field">
      <label for="invDate">التاريخ:</label>
      <input id="invDate" type="date">
    </div>
  </section>

  <table id="tbl">
    <colgroup>
      <col class="c-qty"><col><col><col class="c-price price-col"><col class="c-act">
    </colgroup>
    <thead>
      <tr>
        <th>العدد</th>
        <th>اسم النقشة</th>
        <th>نوع النقشة</th>
        <th class="price-col">السعر</th>
        <th class="act"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
    <tfoot>
      <tr>
        <td id="totalQty">0</td>
        <td colspan="2" class="label">إجمالي العدد</td>
        <td class="price-col" id="totalPrice">0</td>
        <td class="blank act"></td>
      </tr>
    </tfoot>
  </table>

  <button class="add-row" id="addBtn">+ إضافة سطر</button>

  <section class="notes" id="notesBox">
    <label for="notes">ملاحظات</label>
    <textarea id="notes"></textarea>
  </section>
</main>

<main class="sheet" id="summaryView" hidden>
  <p class="doc-title" style="margin-top:0">ملخص النقشات</p>
  <p class="hint" id="sumHint"></p>

  <div class="filter no-print">
    <input id="filter" type="text" placeholder="بحث باسم النقشة" autocomplete="off" aria-label="بحث باسم النقشة">
  </div>

  <table class="sum-table">
    <thead>
      <tr>
        <th>اسم النقشة</th>
        <th class="w-num">إجمالي العدد</th>
        <th class="w-num">عدد الفواتير</th>
      </tr>
    </thead>
    <tbody id="sumBody"></tbody>
    <tfoot>
      <tr>
        <td class="label" style="text-align:left">الإجمالي</td>
        <td id="sumTotalQty">0</td>
        <td id="sumTotalInv">0</td>
      </tr>
    </tfoot>
  </table>

  <div class="no-print">
    <p class="section-title">الفواتير المحفوظة</p>
    <table class="sum-table">
      <thead>
        <tr>
          <th class="w-num">رقم الفاتورة</th>
          <th>العميل</th>
          <th class="w-num">التاريخ</th>
          <th class="w-num">العدد</th>
          <th class="actions-cell"></th>
        </tr>
      </thead>
      <tbody id="savedBody"></tbody>
    </table>

    <p class="section-title">نسخة احتياطية</p>
    <div class="backup">
      <button type="button" id="exportBtn">تصدير الفواتير (ملف)</button>
      <label class="toggle" for="importFile" style="cursor:pointer">استيراد من ملف</label>
      <input type="file" id="importFile" accept=".json,application/json">
    </div>
  </div>
</main>

<datalist id="namesList"></datalist>
<datalist id="typesList"></datalist>

<script>
(function () {
  var rows = document.getElementById('rows');
  var tbl = document.getElementById('tbl');
  var START_ROWS = 10;

  // تحويل الأرقام العربية إلى إنجليزية للحساب
  function toNum(v) {
    if (!v) return 0;
    var map = { '٠':0,'١':1,'٢':2,'٣':3,'٤':4,'٥':5,'٦':6,'٧':7,'٨':8,'٩':9 };
    var s = String(v).replace(/[٠-٩]/g, function (d) { return map[d]; })
                     .replace(/[٫,]/g, '.').replace(/[^\d.\-]/g, '');
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }
  function fmt(n) {
    return (Math.round(n * 100) / 100).toLocaleString('en-US');
  }

  function makeCell(cls, placeholder, listId, inputmode) {
    var td = document.createElement('td');
    if (cls) td.className = cls;
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.autocomplete = 'off';
    if (listId) inp.setAttribute('list', listId);
    if (inputmode) inp.inputMode = inputmode;
    td.appendChild(inp);
    return td;
  }

  function addRow() {
    var tr = document.createElement('tr');
    var qty = makeCell('qty', '', null, 'decimal');
    var name = makeCell('name', '', 'namesList');
    var type = makeCell('type', '', 'typesList');
    var price = makeCell('price price-col', '', null, 'decimal');
    var act = document.createElement('td');
    act.className = 'act';
    var del = document.createElement('button');
    del.className = 'del';
    del.type = 'button';
    del.textContent = '×';
    del.title = 'حذف السطر';
    del.setAttribute('aria-label', 'حذف السطر');
    del.addEventListener('click', function () {
      tr.remove();
      if (!rows.children.length) addRow();
      refresh();
    });
    act.appendChild(del);
    tr.append(qty, name, type, price, act);
    rows.appendChild(tr);
    return tr;
  }

  function refresh() {
    var q = 0, p = 0;
    var names = {}, types = {};
    Array.prototype.forEach.call(rows.children, function (tr) {
      q += toNum(tr.querySelector('.qty input').value);
      p += toNum(tr.querySelector('.price input').value);
      var n = tr.querySelector('.name input').value.trim();
      var t = tr.querySelector('.type input').value.trim();
      if (n) names[n] = 1;
      if (t) types[t] = 1;
    });
    document.getElementById('totalQty').textContent = fmt(q);
    document.getElementById('totalPrice').textContent = fmt(p);
    fillList('namesList', names);
    fillList('typesList', types);
  }
  function fillList(id, obj) {
    var dl = document.getElementById(id);
    dl.innerHTML = '';
    Object.keys(obj).forEach(function (k) {
      var o = document.createElement('option');
      o.value = k;
      dl.appendChild(o);
    });
  }

  rows.addEventListener('input', refresh);

  // Enter ينتقل إلى الحقل التالي، وفي آخر حقل يضيف سطراً جديداً
  rows.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var inputs = Array.prototype.filter.call(
      rows.querySelectorAll('input'),
      function (i) { return i.offsetParent !== null; }
    );
    var idx = inputs.indexOf(e.target);
    if (idx === inputs.length - 1) {
      var tr = addRow();
      tr.querySelector('input').focus();
    } else if (idx > -1) {
      inputs[idx + 1].focus();
    }
  });

  document.getElementById('addBtn').addEventListener('click', function () {
    addRow().querySelector('input').focus();
  });

  document.getElementById('priceToggle').addEventListener('change', function (e) {
    tbl.classList.toggle('with-price', e.target.checked);
  });

  document.getElementById('printBtn').addEventListener('click', function () {
    document.getElementById('notesBox').classList.toggle(
      'empty', !document.getElementById('notes').value.trim()
    );
    window.print();
  });

  // فاتورة جديدة (بضغطتين لتفادي المسح بالخطأ)
  var newBtn = document.getElementById('newBtn');
  var armed = null;
  newBtn.addEventListener('click', function () {
    if (!armed) {
      newBtn.textContent = 'اضغط مرة أخرى للتأكيد';
      newBtn.classList.add('confirming');
      armed = setTimeout(disarm, 3500);
      return;
    }
    disarm();
    var noEl = document.getElementById('invNo');
    var cur = noEl.value.trim();
    var next = /^[\d٠-٩]+$/.test(cur) ? String(toNum(cur) + 1) : '';
    noEl.value = next;
    document.getElementById('client').value = '';
    document.getElementById('notes').value = '';
    currentId = null;
    rows.innerHTML = '';
    for (var i = 0; i < START_ROWS; i++) addRow();
    setToday();
    refresh();
    document.getElementById('client').focus();
  });
  function disarm() {
    clearTimeout(armed);
    armed = null;
    newBtn.textContent = 'فاتورة جديدة';
    newBtn.classList.remove('confirming');
  }

  function setToday() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    document.getElementById('invDate').value = d.getFullYear() + '-' + m + '-' + day;
  }

  // ===== الحفظ وملخص النقشات =====
  var KEY = 'invoice-maker-v1';
  var canStore = true;
  var memory = [];
  var currentId = null;
  var statusEl = document.getElementById('status');
  var statusTimer = null;
  var sheet = document.getElementById('sheet');
  var summaryView = document.getElementById('summaryView');

  function loadAll() {
    try {
      var s = window.localStorage.getItem(KEY);
      var data = s ? JSON.parse(s) : [];
      return Array.isArray(data) ? data : [];
    } catch (e) {
      canStore = false;
      return memory;
    }
  }
  var invoices = loadAll();

  function saveAll() {
    memory = invoices;
    try { window.localStorage.setItem(KEY, JSON.stringify(invoices)); }
    catch (e) { canStore = false; }
  }

  function status(msg, warn) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('warn', !!warn);
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { statusEl.textContent = ''; }, 4000);
  }

  function val(id) { return document.getElementById(id).value; }

  function collect() {
    var list = [];
    Array.prototype.forEach.call(rows.children, function (tr) {
      var r = {
        q: tr.querySelector('.qty input').value.trim(),
        n: tr.querySelector('.name input').value.trim(),
        t: tr.querySelector('.type input').value.trim(),
        p: tr.querySelector('.price input').value.trim()
      };
      if (r.q || r.n || r.t || r.p) list.push(r);
    });
    return {
      id: currentId || ('i' + Date.now().toString(36)),
      shop: val('shop'),
      no: val('invNo').trim(),
      client: val('client').trim(),
      date: val('invDate'),
      notes: val('notes'),
      withPrice: document.getElementById('priceToggle').checked,
      rows: list
    };
  }

  function fillRows(list) {
    rows.innerHTML = '';
    list.forEach(function (r) {
      var tr = addRow();
      tr.querySelector('.qty input').value = r.q || '';
      tr.querySelector('.name input').value = r.n || '';
      tr.querySelector('.type input').value = r.t || '';
      tr.querySelector('.price input').value = r.p || '';
    });
    while (rows.children.length < START_ROWS) addRow();
    refresh();
  }

  function indexOfId(id) {
    for (var i = 0; i < invoices.length; i++) if (invoices[i].id === id) return i;
    return -1;
  }

  function saveInvoice() {
    var inv = collect();
    if (!inv.rows.some(function (r) { return r.n || r.q; })) {
      status('أضف نقشة واحدة على الأقل قبل الحفظ', true);
      return;
    }
    var i = indexOfId(inv.id);
    if (i > -1) invoices[i] = inv; else invoices.push(inv);
    currentId = inv.id;
    saveAll();
    status('تم حفظ الفاتورة' + (inv.no ? ' رقم ' + inv.no : ''));
  }

  function openInvoice(id) {
    var i = indexOfId(id);
    if (i < 0) return;
    var inv = invoices[i];
    currentId = inv.id;
    document.getElementById('shop').value = inv.shop || '';
    document.getElementById('invNo').value = inv.no || '';
    document.getElementById('client').value = inv.client || '';
    document.getElementById('invDate').value = inv.date || '';
    document.getElementById('notes').value = inv.notes || '';
    var pt = document.getElementById('priceToggle');
    pt.checked = !!inv.withPrice;
    tbl.classList.toggle('with-price', pt.checked);
    fillRows(inv.rows || []);
    showView('invoice');
  }

  function norm(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // زر بخطوتين للحذف
  function confirmButton(label, action) {
    var b = el('button', 'small-btn', label);
    b.type = 'button';
    var t = null;
    b.addEventListener('click', function () {
      if (!t) {
        b.textContent = 'تأكيد؟';
        b.classList.add('confirming');
        t = setTimeout(function () {
          t = null; b.textContent = label; b.classList.remove('confirming');
        }, 3000);
        return;
      }
      clearTimeout(t);
      action();
    });
    return b;
  }

  function renderSummary() {
    var q = norm(document.getElementById('filter').value).toLowerCase();
    var map = {};
    invoices.forEach(function (inv) {
      (inv.rows || []).forEach(function (r) {
        var name = norm(r.n) || '(بدون اسم)';
        var key = name.toLowerCase();
        if (!map[key]) map[key] = { name: name, qty: 0, inv: {} };
        map[key].qty += toNum(r.q);
        map[key].inv[inv.id] = 1;
      });
    });
    var arr = Object.keys(map).map(function (k) { return map[k]; })
      .filter(function (g) { return !q || g.name.toLowerCase().indexOf(q) > -1; })
      .sort(function (a, b) { return b.qty - a.qty; });

    var body = document.getElementById('sumBody');
    body.innerHTML = '';
    var total = 0, seen = {};
    if (!arr.length) {
      var tr0 = el('tr');
      var td0 = el('td', 'empty', invoices.length
        ? 'لا توجد نقشة بهذا الاسم.'
        : 'لا توجد فواتير محفوظة بعد. احفظ فاتورة من تبويب «الفاتورة».');
      td0.colSpan = 3;
      tr0.appendChild(td0);
      body.appendChild(tr0);
    }
    arr.forEach(function (g) {
      var tr = el('tr');
      tr.appendChild(el('td', '', g.name));
      tr.appendChild(el('td', 'num', fmt(g.qty)));
      tr.appendChild(el('td', 'num', String(Object.keys(g.inv).length)));
      body.appendChild(tr);
      total += g.qty;
      Object.keys(g.inv).forEach(function (id) { seen[id] = 1; });
    });
    document.getElementById('sumTotalQty').textContent = fmt(total);
    document.getElementById('sumTotalInv').textContent = String(Object.keys(seen).length);

    var hint = 'يشمل ' + invoices.length + ' فاتورة محفوظة. الفواتير غير المحفوظة لا تدخل في الحساب.';
    if (!canStore) hint += ' التخزين غير متاح في هذا العرض، لذا تبقى البيانات حتى إغلاق الصفحة فقط. افتح الملف في المتصفح مباشرة، أو استخدم النسخة الاحتياطية.';
    document.getElementById('sumHint').textContent = hint;

    // قائمة الفواتير المحفوظة
    var sb = document.getElementById('savedBody');
    sb.innerHTML = '';
    if (!invoices.length) {
      var tr1 = el('tr');
      var td1 = el('td', 'empty', 'لا توجد فواتير محفوظة.');
      td1.colSpan = 5;
      tr1.appendChild(td1);
      sb.appendChild(tr1);
    }
    invoices.slice().reverse().forEach(function (inv) {
      var sum = 0;
      (inv.rows || []).forEach(function (r) { sum += toNum(r.q); });
      var tr = el('tr');
      tr.appendChild(el('td', 'num', inv.no || '-'));
      tr.appendChild(el('td', '', inv.client || '-'));
      tr.appendChild(el('td', 'num', inv.date || '-'));
      tr.appendChild(el('td', 'num', fmt(sum)));
      var act = el('td', 'actions-cell');
      var open = el('button', 'small-btn', 'فتح');
      open.type = 'button';
      open.addEventListener('click', function () { openInvoice(inv.id); });
      act.appendChild(open);
      act.appendChild(confirmButton('حذف', function () {
        var i = indexOfId(inv.id);
        if (i > -1) invoices.splice(i, 1);
        if (currentId === inv.id) currentId = null;
        saveAll();
        renderSummary();
      }));
      tr.appendChild(act);
      sb.appendChild(tr);
    });
  }

  function showView(v) {
    var s = v === 'summary';
    sheet.hidden = s;
    summaryView.hidden = !s;
    document.getElementById('tabInvoice').classList.toggle('on', !s);
    document.getElementById('tabSummary').classList.toggle('on', s);
    Array.prototype.forEach.call(document.querySelectorAll('.inv-only'), function (e) {
      e.hidden = s;
    });
    if (s) renderSummary();
  }

  document.getElementById('saveBtn').addEventListener('click', saveInvoice);
  document.getElementById('tabInvoice').addEventListener('click', function () { showView('invoice'); });
  document.getElementById('tabSummary').addEventListener('click', function () { showView('summary'); });
  document.getElementById('filter').addEventListener('input', renderSummary);

  document.getElementById('exportBtn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(invoices)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'invoices-backup.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  document.getElementById('importFile').addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var data = JSON.parse(rd.result);
        if (!Array.isArray(data)) throw new Error('bad');
        var added = 0;
        data.forEach(function (inv) {
          if (!inv || !Array.isArray(inv.rows)) return;
          if (!inv.id) inv.id = 'i' + Date.now().toString(36) + added;
          var i = indexOfId(inv.id);
          if (i > -1) invoices[i] = inv; else invoices.push(inv);
          added++;
        });
        saveAll();
        renderSummary();
        status('تم استيراد ' + added + ' فاتورة');
      } catch (err) {
        status('الملف غير صالح', true);
      }
      e.target.value = '';
    };
    rd.readAsText(f);
  });

  for (var i = 0; i < START_ROWS; i++) addRow();
  setToday();
  refresh();
})();

// ===== التثبيت والعمل بدون إنترنت =====
(function () {
  var deferred = null;
  var btn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    btn.hidden = false;
  });
  btn.addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; btn.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { btn.hidden = true; });

  try {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
    // يطلب من المتصفح عدم حذف الفواتير المحفوظة عند امتلاء المساحة
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) {}
})();
</script>
</body>
</html>
